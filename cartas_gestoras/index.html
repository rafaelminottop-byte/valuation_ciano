<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha Black · Cartas das Gestoras</title>
  <link rel="icon" type="image/x-icon" href="assets/alpha.ico">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <img class="logo" src="assets/alpha_symbol.png" alt="Alpha Black">
      <div>
        <h1>Cartas das Gestoras</h1>
        <p class="sub">Alpha Black Investimentos · resumos das principais gestoras do Brasil</p>
      </div>
    </div>
    <nav class="abas">
      <button class="aba ativa" data-modo="feed">📬 Feed</button>
      <button class="aba" data-modo="gestoras">🏦 Gestoras</button>
    </nav>
  </header>

  <main id="conteudo"></main>

  <footer class="rodape">
    Para adicionar cartas novas: rode <code>coletor.py</code>, peça o resumo ao Claude e edite <code>dados/cartas.js</code>
  </footer>

  <script src="dados/gestoras.js"></script>
  <script src="dados/cartas.js"></script>
  <script src="app.js"></script>
</body>
</html>
